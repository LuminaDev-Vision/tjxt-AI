[project]
name = "tj-aigc-py"
version = "1.0.0"
description = "天机学堂 AIGC 服务 - Python 实现"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiomysql>=0.2.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",
    "openai>=1.50.0",
    "dashscope>=1.20.0",
    "httpx>=0.27.0",
    "pgvector>=0.3.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "nacos-sdk-python>=0.1.12",
    "python-multipart>=0.0.9",
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
