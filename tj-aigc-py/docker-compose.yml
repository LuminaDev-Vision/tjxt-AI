version: "3.9"

services:
  aigc:
    build: .
    container_name: tj-aigc-py
    ports:
      - "8094:8094"
    env_file:
      - .env
    volumes:
      - ./prompts:/app/prompts:ro
    depends_on:
      redis:
        condition: service_started
      pgvector:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tj-aigc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: tj-aigc-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tj_aigc_vectors
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  pgvector_data:
